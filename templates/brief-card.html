<article class="brief-card card" data-card data-search="{{searchText}}" data-topics="{{topics}}" data-type="brief" data-reveal="card">
  <h2><a href="brief-{{slug}}.html">{{title}}</a></h2>
  <p>{{summary}}</p>
  <p class="meta">Status: {{status}} · {{updated}}</p>
  <div class="tag-list">{{topicTags}}</div>
</article>
